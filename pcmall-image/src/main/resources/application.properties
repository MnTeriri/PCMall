server.port=10002
spring.application.name=pcmall-image
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

image.save.dir=D:/Code/IDEA/PCMall/image/static

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.example.pcmallimage.controller
knife4j.enable=true
knife4j.setting.language=zh_cn

logging.level.com.example.pcmallimage=debug
