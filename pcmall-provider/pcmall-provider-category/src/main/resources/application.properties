server.port=11003
spring.application.name=pcmall-provider-category
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pcmall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=root

spring.cloud.sentinel.transport.dashboard= 127.0.0.1:8088
spring.cloud.sentinel.transport.port= 8088

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=1

logging.level.com.example.pcmallprovidercategory=debug

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.example.pcmallprovidercategory.controller

knife4j.enable=true
knife4j.setting.language=zh_cn
