server.port=11005
spring.application.name=pcmall-provider-order
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pcmall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=root

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=2

spring.cloud.sentinel.transport.dashboard=127.0.0.1:8088
spring.cloud.sentinel.transport.port=8088

seata.tx-service-group=my_test_tx_group
seata.service.vgroup-mapping.my_test_tx_group=default
seata.registry.type=nacos
seata.registry.nacos.server-addr=127.0.0.1:8848
seata.registry.nacos.namespace=seata
seata.registry.nacos.group=SEATA_GROUP
seata.registry.nacos.application=seata-server
seata.data-source-proxy-mode=AT

spring.cloud.stream.default-binder=rocketmq
spring.cloud.stream.rocketmq.binder.name-server=127.0.0.1:9876
spring.cloud.stream.bindings.cancelOrder-out-0.destination=test-topic
spring.cloud.stream.bindings.cancelOrder-out-0.contentType=application/json
spring.cloud.stream.bindings.cancelOrder-out-0.group=cancelOrder
spring.cloud.stream.bindings.cancelOrder-in-0.destination=test-topic
spring.cloud.stream.bindings.cancelOrder-in-0.contentType=application/json
spring.cloud.stream.bindings.cancelOrder-in-0.group=cancelOrder
spring.cloud.function.definition=cancelOrder

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.example.pcmallproviderorder.controller

knife4j.enable=true
knife4j.setting.language=zh_cn

mybatis-plus.configuration.cache-enabled=true

logging.level.com.example.pcmallproviderorder=debug

