server.port=11003
spring.application.name=pcmall-provider-payment
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pcmall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=root

spring.cloud.sentinel.transport.dashboard= 127.0.0.1:8088
spring.cloud.sentinel.transport.port= 8088

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=2

mybatis-plus.configuration.cache-enabled=true

logging.level.com.example.pcmallproviderpayment=debug

