server.port=10000
spring.application.name=pcmall-gateway
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.routes[0].id=pcmall-image
spring.cloud.gateway.routes[0].uri=lb://pcmall-image
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/image/**
spring.cloud.gateway.routes[0].filters= StripPrefix=1

spring.cloud.gateway.routes[1].id=pcmall-user-service
spring.cloud.gateway.routes[1].uri=lb://pcmall-user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/captcha.jpg,/api/login,/api/register,/api/test
#spring.cloud.gateway.routes[1].filters= StripPrefix=1

spring.cloud.gateway.routes[2].id=pcmall-consumer-mobile
spring.cloud.gateway.routes[2].uri=lb://pcmall-consumer-mobile
spring.cloud.gateway.routes[2].predicates= Path=/api/mobile/**
spring.cloud.gateway.routes[2].filters= StripPrefix=2

spring.cloud.gateway.routes[3].id=pcmall-consumer-admin
spring.cloud.gateway.routes[3].uri=lb://pcmall-consumer-admin
spring.cloud.gateway.routes[3].predicates= Path=/api/admin/**
spring.cloud.gateway.routes[3].filters= StripPrefix=2

logging.level.com.example.pcmallgateway=debug