server.port=10003
spring.application.name=pcmall-ai
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pcmall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=root

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.username=
spring.data.redis.password=
spring.data.redis.database=4

langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=qwen3.5:9b
langchain4j.ollama.chat-model.log-requests=false
langchain4j.ollama.chat-model.log-responses=false

langchain4j.ollama.streaming-chat-model.base-url=http://localhost:11434
langchain4j.ollama.streaming-chat-model.model-name=qwen3.5:9b
langchain4j.ollama.streaming-chat-model.log-requests=false
langchain4j.ollama.streaming-chat-model.log-responses=false

langchain4j.ollama.embedding-model.base-url=http://localhost:11434
langchain4j.ollama.embedding-model.model-name=qwen3-embedding:8b
langchain4j.ollama.embedding-model.log-requests=false
langchain4j.ollama.embedding-model.log-responses=false

langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.chat-model.model-name=deepseek-v4-flash
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_KEY}
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

langchain4j.open-ai.streaming-chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.streaming-chat-model.model-name=deepseek-v4-flash
langchain4j.open-ai.streaming-chat-model.api-key=${DEEPSEEK_KEY}
langchain4j.open-ai.streaming-chat-model.log-requests=false
langchain4j.open-ai.streaming-chat-model.log-responses=false

milvus.host=localhost
milvus.port=19530

milvus.static.collection-name=pcmall_static_knowledge
milvus.static.dimension=4096
milvus.goods.collection-name=pcmall_goods_knowledge
milvus.goods.dimension=4096

rag.static.max-results=5
rag.static.min-score=0.75
rag.static.base-dir=D:\\Code\\IDEA\\PCMall\\data\\docs
rag.static.refresh-cron=0 0 * * * ?
rag.static.refresh-on-startup=false

rag.goods.max-results=5
rag.goods.min-score=0.75
rag.goods.init.batch-size=5
rag.goods.init.embed-batch-size=5

rocketmq.name-server=localhost:9876
rocketmq.topic=pcmall-goods-change
rocketmq.producer.group=pcmall-goods-producer-group
rocketmq.consumer.group=pcmall-goods-consumer-group

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.example.pcmallai.controller
knife4j.enable=true
knife4j.setting.language=zh_cn

logging.level.com.example.pcmallcommon=debug
logging.level.com.example.pcmallai=debug